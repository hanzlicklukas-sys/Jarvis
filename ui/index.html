<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060608;
      --bg2: #0d0d12;
      --bg3: #13131a;
      --panel: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --cyan: #00d4ff;
      --cyan-dim: rgba(0,212,255,0.5);
      --blue: #0066ff;
      --text: #f0f0f0;
      --text2: #888;
      --text3: #444;
      --green: #00ff88;
      --red: #ff4444;
      --tool-bg: rgba(0,212,255,0.08);
      --tool-border: rgba(0,212,255,0.3);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    #topbar {
      -webkit-app-region: drag;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 0 80px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    #topbar .logo {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--cyan);
      text-transform: uppercase;
      -webkit-app-region: no-drag;
    }
    #topbar .actions {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ── BODY LAYOUT ── */
    #body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── LEFT SIDEBAR ── */
    #sidebar {
      width: 260px;
      border-right: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, width 0.3s ease;
      flex-shrink: 0;
    }
    #sidebar.collapsed {
      width: 0;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    #new-chat-btn {
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--cyan-dim);
      background: transparent;
      color: var(--cyan);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #new-chat-btn:hover { background: rgba(0,212,255,0.08); }

    #sidebar-section { padding: 12px 16px 8px; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }
    #chat-list::-webkit-scrollbar { width: 4px; }
    #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .chat-item:hover { background: var(--panel); }
    .chat-item.active { background: rgba(0,212,255,0.08); }
    .chat-item .chat-preview { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .chat-time { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .chat-item .del-chat { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: 0; font-size: 12px; color: var(--text3); cursor: pointer; }
    .chat-item:hover .del-chat { opacity: 1; }

    #sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .sidebar-footer-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .sidebar-footer-btn:hover { background: var(--panel); color: var(--text); }

    /* ── MAIN AREA ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ── ARC REACTOR / JARVIS HUD ── */
    #orb-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 340px;
      height: 340px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Hex grid background */
    #orb-container::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background-image:
        repeating-linear-gradient(60deg, rgba(0,212,255,0.03) 0, rgba(0,212,255,0.03) 1px, transparent 0, transparent 50%),
        repeating-linear-gradient(120deg, rgba(0,212,255,0.03) 0, rgba(0,212,255,0.03) 1px, transparent 0, transparent 50%),
        repeating-linear-gradient(0deg, rgba(0,212,255,0.03) 0, rgba(0,212,255,0.03) 1px, transparent 0, transparent 50%);
      background-size: 30px 52px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #orb-container:hover::before { opacity: 1; }

    /* Outer pulse ring */
    .arc-pulse {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.15);
      pointer-events: none;
      animation: arc-pulse-out 3s ease-out infinite;
    }
    .arc-pulse:nth-child(1) { width: 320px; height: 320px; animation-delay: 0s; }
    .arc-pulse:nth-child(2) { width: 320px; height: 320px; animation-delay: 1s; }
    .arc-pulse:nth-child(3) { width: 320px; height: 320px; animation-delay: 2s; }
    @keyframes arc-pulse-out {
      0%   { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.3);  opacity: 0; }
    }

    /* Ring 3 — outermost rotating dashes */
    .arc-ring-3 {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0,212,255,0.2);
      animation: ring-cw 20s linear infinite;
      pointer-events: none;
    }

    /* Ring 2 — tick marks ring */
    .arc-ring-2 {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.08);
      animation: ring-ccw 10s linear infinite;
      pointer-events: none;
    }
    .arc-ring-2::before, .arc-ring-2::after {
      content: '';
      position: absolute;
      background: var(--cyan);
      opacity: 0.6;
    }
    /* tick top */
    .arc-ring-2::before { width: 2px; height: 12px; top: -6px; left: 50%; transform: translateX(-50%); }
    /* tick right */
    .arc-ring-2::after  { width: 12px; height: 2px; right: -6px; top: 50%; transform: translateY(-50%); }

    /* Ring 1 — fast inner arc segments */
    .arc-ring-1 {
      position: absolute;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--cyan);
      border-right-color: rgba(0,212,255,0.4);
      animation: ring-cw 3s linear infinite;
      pointer-events: none;
      filter: drop-shadow(0 0 4px var(--cyan));
    }

    /* Inner accent ring */
    .arc-ring-inner {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.15);
      border-bottom-color: rgba(0,212,255,0.5);
      animation: ring-ccw 6s linear infinite;
      pointer-events: none;
    }

    @keyframes ring-cw  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
    @keyframes ring-ccw { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }

    /* The core */
    #orb {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%,
          rgba(255,255,255,0.9) 0%,
          rgba(0,212,255,1) 18%,
          rgba(0,100,220,0.9) 45%,
          rgba(0,20,80,1) 75%,
          rgba(0,5,20,1) 100%
        );
      box-shadow:
        0 0 0 2px rgba(0,212,255,0.3),
        0 0 20px rgba(0,212,255,0.5),
        0 0 60px rgba(0,150,255,0.3),
        0 0 100px rgba(0,100,255,0.15),
        inset 0 0 20px rgba(0,0,0,0.4);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: box-shadow 0.4s;
    }

    /* Core inner triangle segments (arc reactor look) */
    #orb::before {
      content: '';
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(0,212,255,0.12);
      border: 1.5px solid rgba(0,212,255,0.5);
      box-shadow: 0 0 12px rgba(0,212,255,0.6), inset 0 0 12px rgba(0,212,255,0.3);
    }
    #orb::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00d4ff 50%, #0066ff 100%);
      box-shadow: 0 0 16px #00d4ff, 0 0 32px rgba(0,212,255,0.8);
    }

    #orb-icon {
      position: absolute;
      font-size: 0;
      opacity: 0;
    }

    /* State: idle — gentle breathe */
    #orb-container.idle #orb {
      animation: core-breathe 4s ease-in-out infinite;
    }
    @keyframes core-breathe {
      0%,100% { box-shadow: 0 0 0 2px rgba(0,212,255,0.3), 0 0 20px rgba(0,212,255,0.5), 0 0 60px rgba(0,150,255,0.3), inset 0 0 20px rgba(0,0,0,0.4); }
      50%      { box-shadow: 0 0 0 3px rgba(0,212,255,0.5), 0 0 35px rgba(0,212,255,0.8), 0 0 90px rgba(0,150,255,0.5), inset 0 0 20px rgba(0,0,0,0.4); }
    }

    /* State: listening — fast bright pulse */
    #orb-container.listening #orb {
      animation: core-listen 0.6s ease-in-out infinite;
      background: radial-gradient(circle at 38% 32%, #fff 0%, #00ffff 20%, #0088ff 50%, #001040 100%);
    }
    #orb-container.listening .arc-ring-1 { animation-duration: 0.8s; border-top-color: #00ffff; filter: drop-shadow(0 0 8px #00ffff); }
    #orb-container.listening .arc-pulse { animation-duration: 1s; border-color: rgba(0,255,255,0.4); }
    @keyframes core-listen {
      0%,100% { box-shadow: 0 0 0 3px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.9), 0 0 100px rgba(0,212,255,0.5), inset 0 0 20px rgba(0,0,0,0.3); }
      50%      { box-shadow: 0 0 0 6px rgba(0,212,255,0.4), 0 0 70px rgba(0,212,255,1),   0 0 160px rgba(0,212,255,0.7), inset 0 0 20px rgba(0,0,0,0.3); transform: scale(1.05); }
    }

    /* State: thinking — purple hue rotation */
    #orb-container.thinking #orb {
      animation: core-think 2s linear infinite;
      background: radial-gradient(circle at 38% 32%, #fff 0%, #aa88ff 20%, #5500cc 50%, #0a0020 100%);
    }
    #orb-container.thinking .arc-ring-1 { animation-duration: 1s; border-top-color: #aa88ff; border-right-color: rgba(170,136,255,0.4); filter: drop-shadow(0 0 6px #aa88ff); }
    #orb-container.thinking .arc-ring-2 { animation-duration: 3s; }
    @keyframes core-think {
      0%   { filter: hue-rotate(0deg)   brightness(1); }
      50%  { filter: hue-rotate(40deg)  brightness(1.2); }
      100% { filter: hue-rotate(0deg)   brightness(1); }
    }

    /* State: speaking — green energy wave */
    #orb-container.speaking #orb {
      animation: core-speak 0.4s ease-in-out infinite;
      background: radial-gradient(circle at 38% 32%, #fff 0%, #88ffcc 20%, #00aa66 50%, #001a10 100%);
    }
    #orb-container.speaking .arc-ring-1 { border-top-color: #00ff88; filter: drop-shadow(0 0 8px #00ff88); }
    #orb-container.speaking .arc-pulse { border-color: rgba(0,255,136,0.3); }
    @keyframes core-speak {
      0%,100% { transform: scale(1);    box-shadow: 0 0 0 2px rgba(0,255,136,0.4), 0 0 30px rgba(0,255,136,0.6), 0 0 80px rgba(0,255,136,0.3), inset 0 0 20px rgba(0,0,0,0.4); }
      25%      { transform: scale(1.06); }
      75%      { transform: scale(0.96); }
    }

    /* ── USER TEXT (above orb) ── */
    #user-text {
      text-align: center;
      font-size: 14px;
      color: var(--text2);
      max-width: 500px;
      min-height: 24px;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      font-style: italic;
    }
    #user-text.visible { opacity: 1; }

    /* ── RESPONSE TEXT (below orb) ── */
    #response-area {
      max-width: 600px;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 16px;
    }
    #response-area::-webkit-scrollbar { width: 3px; }
    #response-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #response-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      font-weight: 300;
    }
    #response-text .code-inline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }
    #response-text pre {
      text-align: left;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      overflow-x: auto;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    /* ── TOOL BADGES ── */
    #tool-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
      min-height: 28px;
    }
    .tool-badge {
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      font-size: 11px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: badge-in 0.2s ease;
    }
    @keyframes badge-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .tool-badge .spinner {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--cyan-dim);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATUS TEXT ── */
    #status-text {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
      min-height: 18px;
      transition: color 0.3s;
      text-align: center;
    }
    #status-text.listening { color: var(--cyan); }
    #status-text.thinking { color: #aa88ff; }
    #status-text.speaking { color: var(--green); }
    #status-text.error { color: var(--red); }

    /* ── BOTTOM INPUT ── */
    #input-bar {
      width: 100%;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      background: rgba(13,13,18,0.8);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #text-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 42px;
      line-height: 22px;
    }
    #text-input:focus { border-color: var(--cyan-dim); }
    #text-input::placeholder { color: var(--text3); }
    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: none;
      background: var(--cyan);
      color: #000;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #33ddff; transform: scale(1.05); }
    #send-btn:disabled { background: var(--text3); cursor: not-allowed; transform: none; }

    /* ── RIGHT SETTINGS PANEL ── */
    #settings-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #settings-panel.open { right: 0; }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 { font-size: 15px; font-weight: 600; }
    .panel-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 4px; }
    .panel-close:hover { color: var(--text); }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); }

    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--cyan-dim); }
    textarea.form-input { resize: vertical; min-height: 100px; font-size: 12px; line-height: 1.5; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--text3);
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--cyan); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 23px; }

    .save-btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: var(--cyan);
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .save-btn:hover { background: #33ddff; }

    .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .memory-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .memory-item .mem-content { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.4; }
    .memory-item .mem-type { font-size: 10px; color: var(--cyan); background: var(--tool-bg); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .memory-item .mem-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 0; flex-shrink: 0; }
    .memory-item .mem-del:hover { color: var(--red); }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── VOICE HINT ── */
    #voice-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text3);
      white-space: nowrap;
    }

    /* ── ERROR TOAST ── */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,68,68,0.15);
      border: 1px solid rgba(255,68,68,0.4);
      color: #ff8888;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <span class="logo">J·A·R·V·I·S</span>
    <div class="actions">
      <button class="icon-btn" id="sidebar-toggle" title="Toggle history">☰</button>
      <button class="icon-btn" id="memory-btn" title="Memory">🧠</button>
      <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
    </div>
  </div>

  <!-- BODY -->
  <div id="body">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-header">
        <button id="new-chat-btn">＋ New conversation</button>
      </div>
      <div id="sidebar-section">Recent</div>
      <div id="chat-list"></div>
      <div id="sidebar-footer">
        <button class="sidebar-footer-btn" id="clear-btn">🗑 Clear conversation</button>
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">

      <!-- User text above orb -->
      <div id="user-text"></div>

      <!-- ARC REACTOR ORB -->
      <div id="orb-container" class="idle" title="Click to speak">
        <div class="arc-pulse"></div>
        <div class="arc-pulse"></div>
        <div class="arc-pulse"></div>
        <div class="arc-ring-3"></div>
        <div class="arc-ring-2"></div>
        <div class="arc-ring-1"></div>
        <div class="arc-ring-inner"></div>
        <div id="orb"><span id="orb-icon"></span></div>
      </div>

      <!-- Tool badges -->
      <div id="tool-badges"></div>

      <!-- Status -->
      <div id="status-text">Click the orb to speak, or type below</div>

      <!-- Response below orb -->
      <div id="response-area">
        <div id="response-text"></div>
      </div>

      <div id="voice-hint">⌘⇧J to show/hide · Click orb to speak</div>

    </div>

  </div>

  <!-- BOTTOM INPUT -->
  <div id="input-bar">
    <textarea id="text-input" placeholder="Or type here..." rows="1"></textarea>
    <button id="send-btn">↑</button>
  </div>

  <!-- SETTINGS PANEL -->
  <div id="overlay"></div>
  <div id="settings-panel">
    <div class="panel-header">
      <h2 id="panel-title">Settings</h2>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body" id="panel-body">
      <!-- filled dynamically -->
    </div>
  </div>

  <!-- ERROR TOAST -->
  <div id="toast"></div>

  <script>
  (function() {
    'use strict';

    // ── State ──────────────────────────────────────────────────────────────────
    const state = {
      orbState: 'idle',       // idle | listening | thinking | speaking
      isProcessing: false,
      conversationHistory: [],
      settings: {},
      currentConvId: null,
      panelMode: null,        // null | 'settings' | 'memory'
    };

    // ── Elements ───────────────────────────────────────────────────────────────
    const orb = document.getElementById('orb-container');
    const orbIcon = document.getElementById('orb-icon');
    const userText = document.getElementById('user-text');
    const responseText = document.getElementById('response-text');
    const responseArea = document.getElementById('response-area');
    const toolBadges = document.getElementById('tool-badges');
    const statusText = document.getElementById('status-text');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const chatList = document.getElementById('chat-list');
    const settingsPanel = document.getElementById('settings-panel');
    const overlay = document.getElementById('overlay');
    const panelBody = document.getElementById('panel-body');
    const panelTitle = document.getElementById('panel-title');
    const toast = document.getElementById('toast');

    // ── Helpers ────────────────────────────────────────────────────────────────
    function setOrbState(s) {
      state.orbState = s;
      orb.className = s;
      statusText.className = s;
      const labels = {
        idle: 'Click to speak with JARVIS',
        listening: 'Listening… speak now',
        thinking: 'JARVIS is thinking…',
        speaking: 'JARVIS is speaking…'
      };
      statusText.textContent = labels[s] || '';
    }

    function showToast(msg, duration = 3000) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    function showUserText(text) {
      userText.textContent = '"' + text + '"';
      userText.classList.add('visible');
    }

    function clearResponse() {
      responseText.innerHTML = '';
      toolBadges.innerHTML = '';
    }

    // Basic markdown → HTML
    function renderMarkdown(text) {
      return text
        .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
        .replace(/`([^`]+)`/g, '<span class="code-inline">$1</span>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    // ── Tool badges ────────────────────────────────────────────────────────────
    const activeBadges = {};

    function showToolBadge(name) {
      const badge = document.createElement('div');
      badge.className = 'tool-badge';
      badge.innerHTML = `<span class="spinner"></span><span>🔧 ${name.replace(/_/g,' ')}</span>`;
      toolBadges.appendChild(badge);
      activeBadges[name] = badge;
    }

    function removeToolBadge(name) {
      if (activeBadges[name]) {
        activeBadges[name].remove();
        delete activeBadges[name];
      }
    }

    // ── Streaming ──────────────────────────────────────────────────────────────
    let streamBuffer = '';
    let streamTimeout = null;

    function appendToken(token) {
      streamBuffer += token;
      if (streamTimeout) clearTimeout(streamTimeout);
      streamTimeout = setTimeout(flushBuffer, 16);
    }

    function flushBuffer() {
      if (streamBuffer) {
        responseText.innerHTML = renderMarkdown(streamBuffer);
        responseArea.scrollTop = responseArea.scrollHeight;
      }
    }

    // ── Send message ───────────────────────────────────────────────────────────
    async function sendMessage(text) {
      if (!text.trim() || state.isProcessing) return;
      state.isProcessing = true;
      sendBtn.disabled = true;

      showUserText(text);
      clearResponse();
      setOrbState('thinking');
      streamBuffer = '';

      // Add to history
      state.conversationHistory.push({ role: 'user', content: text });
      if (state.conversationHistory.length > 40) state.conversationHistory.splice(0, 2);

      // Save to localStorage
      saveConversation(text);

      // Remove old listeners
      window.jarvis.removeListeners('chat:token');
      window.jarvis.removeListeners('chat:done');
      window.jarvis.removeListeners('chat:error');

      // Set up listeners
      window.jarvis.onToken((data) => {
        if (data.type === 'text') {
          appendToken(data.token);
        } else if (data.type === 'tool_start') {
          showToolBadge(data.toolName);
        } else if (data.type === 'tool_end') {
          removeToolBadge(data.toolName);
        }
      });

      window.jarvis.onDone((data) => {
        flushBuffer();
        toolBadges.innerHTML = '';
        state.conversationHistory.push({ role: 'assistant', content: data.fullResponse });
        setOrbState('idle');
        state.isProcessing = false;
        sendBtn.disabled = false;
        userText.classList.remove('visible');
      });

      window.jarvis.onError((data) => {
        toolBadges.innerHTML = '';
        showToast('Error: ' + data.error);
        setOrbState('idle');
        state.isProcessing = false;
        sendBtn.disabled = false;
      });

      window.jarvis.sendMessage(text, state.conversationHistory);
    }

    // ── Voice flow ─────────────────────────────────────────────────────────────
    async function startVoice() {
      if (state.isProcessing) return;
      setOrbState('listening');

      try {
        const result = await window.jarvis.listen();
        if (result.error) {
          showToast('Voice error: ' + result.error);
          setOrbState('idle');
          return;
        }
        const transcript = (result.transcript || '').trim();
        if (!transcript) {
          showToast('No speech detected');
          setOrbState('idle');
          return;
        }
        textInput.value = '';
        await sendMessage(transcript);
      } catch (err) {
        showToast('Voice error: ' + err.message);
        setOrbState('idle');
      }
    }

    orb.addEventListener('click', startVoice);

    // ── Text input ─────────────────────────────────────────────────────────────
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = textInput.value.trim();
        if (text) {
          textInput.value = '';
          sendMessage(text);
        }
      }
    });

    sendBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (text) {
        textInput.value = '';
        sendMessage(text);
      }
    });

    // ── Sidebar toggle ─────────────────────────────────────────────────────────
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });

    // ── New chat ───────────────────────────────────────────────────────────────
    document.getElementById('new-chat-btn').addEventListener('click', () => {
      state.conversationHistory = [];
      clearResponse();
      userText.classList.remove('visible');
      userText.textContent = '';
      setOrbState('idle');
      state.currentConvId = null;
    });

    // ── Clear ──────────────────────────────────────────────────────────────────
    document.getElementById('clear-btn').addEventListener('click', () => {
      state.conversationHistory = [];
      clearResponse();
      userText.classList.remove('visible');
    });

    // ── Past conversations (localStorage) ─────────────────────────────────────
    function getConversations() {
      try { return JSON.parse(localStorage.getItem('jarvis_convs') || '[]'); } catch { return []; }
    }

    function saveConversation(firstMsg) {
      if (state.currentConvId) return; // already saved this session
      const convs = getConversations();
      const id = Date.now();
      state.currentConvId = id;
      convs.unshift({ id, preview: firstMsg.substring(0, 60), time: new Date().toLocaleString() });
      if (convs.length > 30) convs.pop();
      localStorage.setItem('jarvis_convs', JSON.stringify(convs));
      renderChatList();
    }

    function renderChatList() {
      const convs = getConversations();
      chatList.innerHTML = '';
      convs.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (c.id === state.currentConvId ? ' active' : '');
        item.innerHTML = `
          <div class="chat-preview">${c.preview}</div>
          <div class="chat-time">${c.time}</div>
          <span class="del-chat" data-id="${c.id}">✕</span>
        `;
        item.querySelector('.del-chat').addEventListener('click', (e) => {
          e.stopPropagation();
          const convs2 = getConversations().filter(x => x.id !== c.id);
          localStorage.setItem('jarvis_convs', JSON.stringify(convs2));
          renderChatList();
        });
        chatList.appendChild(item);
      });
    }

    // ── Panels ─────────────────────────────────────────────────────────────────
    function openPanel(mode) {
      state.panelMode = mode;
      overlay.classList.add('visible');
      settingsPanel.classList.add('open');
      if (mode === 'settings') renderSettingsPanel();
      else if (mode === 'memory') renderMemoryPanel();
    }

    function closePanel() {
      settingsPanel.classList.remove('open');
      overlay.classList.remove('visible');
      state.panelMode = null;
    }

    document.getElementById('settings-btn').addEventListener('click', () => openPanel('settings'));
    document.getElementById('memory-btn').addEventListener('click', () => openPanel('memory'));
    document.getElementById('panel-close').addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    // ── Settings panel ─────────────────────────────────────────────────────────
    async function renderSettingsPanel() {
      panelTitle.textContent = 'Settings';
      const s = await window.jarvis.getSettings();
      state.settings = s;
      panelBody.innerHTML = `
        <div class="form-group">
          <label class="form-label">Anthropic API Key</label>
          <input class="form-input" id="s-apikey" type="password" placeholder="sk-ant-..." value="${s.apiKey || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input class="form-input" id="s-username" type="text" value="${s.userName || 'User'}">
        </div>
        <div class="form-group">
          <div class="toggle-row">
            <label class="form-label" style="margin:0">Text-to-Speech</label>
            <button class="toggle ${s.ttsEnabled ? 'on' : ''}" id="s-tts"></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">JARVIS Personality</label>
          <textarea class="form-input" id="s-prompt">${s.systemPrompt || ''}</textarea>
        </div>
        <button class="save-btn" id="s-save">Save Settings</button>
      `;

      document.getElementById('s-tts').addEventListener('click', function() {
        this.classList.toggle('on');
      });

      document.getElementById('s-save').addEventListener('click', async () => {
        const newSettings = {
          ...s,
          userName: document.getElementById('s-username').value,
          ttsEnabled: document.getElementById('s-tts').classList.contains('on'),
          systemPrompt: document.getElementById('s-prompt').value,
        };
        const apiKey = document.getElementById('s-apikey').value.trim();
        if (apiKey) newSettings.apiKey = apiKey;
        await window.jarvis.saveSettings(newSettings);
        state.settings = newSettings;
        showToast('Settings saved ✓');
        closePanel();
      });
    }

    // ── Memory panel ───────────────────────────────────────────────────────────
    async function renderMemoryPanel() {
      panelTitle.textContent = 'Memory';
      panelBody.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:10px 0">Loading…</div>';
      const memories = await window.jarvis.getAllMemories();
      if (!memories || memories.length === 0) {
        panelBody.innerHTML = `
          <div style="text-align:center;padding:40px 0;color:var(--text3)">
            <div style="font-size:32px;margin-bottom:12px">🧠</div>
            <div style="font-size:13px">No memories yet.<br>Ask JARVIS to remember something.</div>
          </div>`;
        return;
      }
      panelBody.innerHTML = `<div style="font-size:12px;color:var(--text2);margin-bottom:16px">${memories.length} memories stored</div>`;
      memories.forEach(m => {
        const item = document.createElement('div');
        item.className = 'memory-item';
        item.innerHTML = `
          <div>
            <span class="mem-type">${m.type || 'general'}</span>
          </div>
          <div class="mem-content">${m.content.substring(0, 120)}${m.content.length > 120 ? '…' : ''}</div>
          <button class="mem-del" data-id="${m.id}">✕</button>
        `;
        item.querySelector('.mem-del').addEventListener('click', async function() {
          await window.jarvis.deleteMemory(parseInt(this.dataset.id));
          item.remove();
        });
        panelBody.appendChild(item);
      });
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    async function init() {
      renderChatList();
      try {
        state.settings = await window.jarvis.getSettings();
      } catch (e) {
        // no settings yet
      }
      setOrbState('idle');
    }

    init();

  })();
  </script>
</body>
</html>
