<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060608;
      --sidebar-bg: #0c0c10;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --cyan: #00d4ff;
      --blue: #0055ff;
      --text: #f0f0f0;
      --text2: #888;
      --text3: #444;
      --green: #00ff88;
      --red: #ff4455;
      --tool: rgba(0,212,255,0.12);
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── TITLEBAR ── */
    #titlebar {
      -webkit-app-region: drag;
      height: 38px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px 0 80px;
      flex-shrink: 0;
      justify-content: space-between;
    }
    #titlebar .title {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 500;
    }
    #titlebar .controls {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #titlebar .controls button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    #titlebar .controls button:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── MAIN LAYOUT ── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s ease;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header span { font-size: 11px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; }

    #new-chat-btn {
      width: calc(100% - 32px);
      margin: 12px 16px;
      padding: 9px;
      background: none;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: inherit;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    #new-chat-btn:hover { background: rgba(0,212,255,0.08); }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }
    #chat-list::-webkit-scrollbar { width: 4px; }
    #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-item {
      padding: 10px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
      border: 1px solid transparent;
    }
    .chat-item:hover { background: var(--panel); }
    .chat-item.active { background: var(--panel); border-color: rgba(0,212,255,0.2); }
    .chat-item .chat-preview {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item .chat-time {
      font-size: 10px;
      color: var(--text3);
      margin-top: 3px;
    }

    #sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    #tts-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text2);
      cursor: pointer;
      padding: 6px 0;
    }
    .toggle-switch {
      width: 32px; height: 18px;
      background: var(--border);
      border-radius: 9px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-switch.on { background: var(--cyan); }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: left 0.2s;
    }
    .toggle-switch.on::after { left: 17px; }

    /* ── MAIN AREA ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── CHAT MESSAGES (old chat view) ── */
    #chat-view {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    #chat-view::-webkit-scrollbar { width: 4px; }
    #chat-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #chat-view.visible { display: flex; }

    .msg { display: flex; gap: 12px; max-width: 800px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .msg.jarvis .msg-avatar { background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); color: var(--cyan); }
    .msg.user .msg-avatar { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text2); }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 600px;
    }
    .msg.jarvis .msg-bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 2px; }
    .msg.user .msg-bubble { background: rgba(0,85,255,0.15); border: 1px solid rgba(0,85,255,0.3); border-top-right-radius: 2px; }
    .msg-bubble strong { color: var(--cyan); font-weight: 600; }
    .msg-bubble code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; }
    .msg-bubble pre { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
    .msg-time { font-size: 10px; color: var(--text3); margin-top: 4px; padding: 0 4px; }

    /* ── ORB VIEW (main/active view) ── */
    #orb-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 20px;
      position: relative;
    }

    /* User message above orb */
    #user-text {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 28px;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      max-width: 500px;
      min-height: 20px;
    }
    #user-text.visible { opacity: 1; }

    /* ── ARC REACTOR ── */
    #orb-wrap {
      position: relative;
      width: 280px; height: 280px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .arc-pulse {
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.2);
      animation: pulse-out 3s ease-out infinite;
      pointer-events: none;
    }
    .arc-pulse:nth-child(2) { animation-delay: 1s; }
    .arc-pulse:nth-child(3) { animation-delay: 2s; }
    @keyframes pulse-out {
      0%   { transform: scale(0.7); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .arc-ring { position: absolute; border-radius: 50%; pointer-events: none; }
    .arc-ring-outer {
      width: 248px; height: 248px;
      border: 1px dashed rgba(0,212,255,0.18);
      animation: spin-cw 25s linear infinite;
    }
    .arc-ring-mid {
      width: 210px; height: 210px;
      border: 1.5px solid rgba(0,212,255,0.08);
      border-top-color: rgba(0,212,255,0.5);
      border-right-color: rgba(0,212,255,0.3);
      animation: spin-cw 4s linear infinite;
      filter: drop-shadow(0 0 3px rgba(0,212,255,0.4));
    }
    .arc-ring-inner {
      width: 175px; height: 175px;
      border: 1px solid rgba(0,212,255,0.12);
      border-bottom-color: rgba(0,212,255,0.4);
      animation: spin-ccw 8s linear infinite;
    }
    .arc-ring-tick {
      width: 175px; height: 175px;
      border: none;
      position: absolute;
    }
    .arc-ring-tick::before, .arc-ring-tick::after {
      content: ''; position: absolute; background: var(--cyan); opacity: 0.5;
    }
    .arc-ring-tick::before { width: 2px; height: 10px; top: -5px; left: 50%; transform: translateX(-50%); }
    .arc-ring-tick::after  { width: 10px; height: 2px; right: -5px; top: 50%; transform: translateY(-50%); }

    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }

    #orb-core {
      width: 130px; height: 130px;
      border-radius: 50%;
      position: absolute;
      background: radial-gradient(circle at 35% 30%,
        #ffffff 0%, #00d4ff 15%, #0055ff 45%, #001033 80%, #000510 100%);
      box-shadow:
        0 0 0 1.5px rgba(0,212,255,0.4),
        0 0 20px rgba(0,212,255,0.5),
        0 0 60px rgba(0,100,255,0.3),
        inset 0 0 25px rgba(0,0,0,0.5);
      z-index: 5;
      transition: all 0.4s;
    }
    #orb-core::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,212,255,0.5);
      box-shadow: 0 0 10px rgba(0,212,255,0.5), inset 0 0 10px rgba(0,212,255,0.2);
    }
    #orb-core::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 20px; height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #00d4ff 60%);
      box-shadow: 0 0 14px #00d4ff, 0 0 28px rgba(0,212,255,0.7);
    }

    /* Orb states */
    #orb-wrap.idle #orb-core { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe {
      0%,100% { box-shadow: 0 0 0 1.5px rgba(0,212,255,0.4), 0 0 20px rgba(0,212,255,0.5), 0 0 60px rgba(0,100,255,0.3), inset 0 0 25px rgba(0,0,0,0.5); }
      50%      { box-shadow: 0 0 0 2px rgba(0,212,255,0.6), 0 0 35px rgba(0,212,255,0.8), 0 0 90px rgba(0,100,255,0.5), inset 0 0 25px rgba(0,0,0,0.5); }
    }

    #orb-wrap.listening #orb-core {
      animation: listen-pulse 0.7s ease-in-out infinite;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #00ffff 15%, #00aaff 45%, #001040 80%);
    }
    #orb-wrap.listening .arc-ring-mid { animation-duration: 0.6s; border-top-color: #00ffff; filter: drop-shadow(0 0 8px #00ffff); }
    @keyframes listen-pulse {
      0%,100% { transform: scale(1);    box-shadow: 0 0 0 2px rgba(0,212,255,0.7), 0 0 40px rgba(0,212,255,1), 0 0 100px rgba(0,212,255,0.5), inset 0 0 25px rgba(0,0,0,0.4); }
      50%      { transform: scale(1.07); box-shadow: 0 0 0 5px rgba(0,212,255,0.4), 0 0 60px rgba(0,212,255,1), 0 0 140px rgba(0,212,255,0.6), inset 0 0 25px rgba(0,0,0,0.4); }
    }

    #orb-wrap.thinking #orb-core {
      animation: think-rotate 2s linear infinite;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #bb88ff 15%, #5500cc 45%, #0a0020 80%);
    }
    #orb-wrap.thinking .arc-ring-mid { border-top-color: #aa88ff; animation-duration: 1s; filter: drop-shadow(0 0 6px #aa88ff); }
    @keyframes think-rotate {
      0%   { filter: hue-rotate(0deg)  brightness(1); }
      50%  { filter: hue-rotate(40deg) brightness(1.3); }
      100% { filter: hue-rotate(0deg)  brightness(1); }
    }

    #orb-wrap.speaking #orb-core {
      animation: speak-wave 0.45s ease-in-out infinite;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #88ffcc 15%, #00aa66 45%, #001a10 80%);
    }
    #orb-wrap.speaking .arc-ring-mid { border-top-color: #00ff88; filter: drop-shadow(0 0 8px #00ff88); }
    @keyframes speak-wave {
      0%,100% { transform: scale(1);    box-shadow: 0 0 0 2px rgba(0,255,136,0.5), 0 0 30px rgba(0,255,136,0.7), 0 0 80px rgba(0,255,136,0.3), inset 0 0 25px rgba(0,0,0,0.5); }
      25%      { transform: scale(1.07); }
      75%      { transform: scale(0.95); }
    }

    /* Status text below orb */
    #orb-status {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
      text-align: center;
    }
    #orb-status.listening { color: var(--cyan); }
    #orb-status.thinking  { color: #aa88ff; }
    #orb-status.speaking  { color: var(--green); }

    /* Tool badges */
    #tool-badges {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      margin-top: 12px; min-height: 24px;
    }
    .tool-badge {
      padding: 4px 12px;
      border: 1px solid rgba(0,212,255,0.35);
      background: var(--tool);
      border-radius: 20px;
      font-size: 11px;
      color: var(--cyan);
      display: flex; align-items: center; gap: 6px;
      animation: badge-in 0.2s ease;
    }
    @keyframes badge-in { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
    .tool-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: badge-dot 0.8s ease-in-out infinite; }
    @keyframes badge-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Response text below orb */
    #response-area {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
      max-width: 640px;
    }
    #response-area::-webkit-scrollbar { width: 3px; }
    #response-area::-webkit-scrollbar-thumb { background: var(--border); }
    #response-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      text-align: center;
      min-height: 28px;
    }
    #response-text strong { color: var(--cyan); font-weight: 600; }
    #response-text code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; }
    #response-text pre { text-align: left; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }

    /* ── BOTTOM INPUT ── */
    #input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #text-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      resize: none;
      height: 40px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    #text-input:focus { border-color: rgba(0,212,255,0.4); }
    #text-input::placeholder { color: var(--text3); }
    #send-btn {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: rgba(0,212,255,0.15);
      border: 1px solid rgba(0,212,255,0.3);
      color: var(--cyan);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: rgba(0,212,255,0.25); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #sidebar-toggle {
      width: 34px; height: 34px;
      border-radius: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #sidebar-toggle:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(20,20,28,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <div id="titlebar">
    <span class="title">J · A · R · V · I · S</span>
    <div class="controls">
      <button id="history-btn">Chat History</button>
      <button id="clear-btn">New Chat</button>
    </div>
  </div>

  <div id="layout">

    <!-- SIDEBAR: past conversations -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span>Past Conversations</span>
      </div>
      <button id="new-chat-btn">+ New Chat</button>
      <div id="chat-list"></div>
      <div id="sidebar-footer">
        <div id="tts-toggle">
          <div class="toggle-switch on" id="tts-switch"></div>
          <span>JARVIS Voice</span>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">

      <!-- OLD CHAT VIEW -->
      <div id="chat-view"></div>

      <!-- ORB VIEW (live) -->
      <div id="orb-view">
        <div id="user-text"></div>

        <div id="orb-wrap" class="idle">
          <div class="arc-pulse"></div>
          <div class="arc-pulse"></div>
          <div class="arc-pulse"></div>
          <div class="arc-ring arc-ring-outer"></div>
          <div class="arc-ring arc-ring-mid"></div>
          <div class="arc-ring arc-ring-inner"></div>
          <div class="arc-ring arc-ring-tick"></div>
          <div id="orb-core"></div>
        </div>

        <div id="orb-status">Click to speak</div>
        <div id="tool-badges"></div>

        <div id="response-area">
          <div id="response-text"></div>
        </div>
      </div>

      <!-- INPUT BAR -->
      <div id="input-bar">
        <button id="sidebar-toggle">☰</button>
        <textarea id="text-input" placeholder="Or type here… (Enter to send)" rows="1"></textarea>
        <button id="send-btn">↑</button>
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <script>
    const orbWrap    = document.getElementById('orb-wrap');
    const orbStatus  = document.getElementById('orb-status');
    const userText   = document.getElementById('user-text');
    const responseText = document.getElementById('response-text');
    const responseArea = document.getElementById('response-area');
    const toolBadges = document.getElementById('tool-badges');
    const textInput  = document.getElementById('text-input');
    const sendBtn    = document.getElementById('send-btn');
    const chatView   = document.getElementById('chat-view');
    const orbView    = document.getElementById('orb-view');
    const chatList   = document.getElementById('chat-list');
    const sidebar    = document.getElementById('sidebar');
    const ttsSwitch  = document.getElementById('tts-switch');
    const toast      = document.getElementById('toast');

    // ── State ──────────────────────────────────────────────────────────────────
    const state = {
      ttsOn: true,
      processing: false,
      history: [],          // current conversation messages
      buffer: '',
      streamTimeout: null,
      viewingOld: false,
      sidebarOpen: true
    };

    // ── Helpers ────────────────────────────────────────────────────────────────
    function setOrb(s) {
      orbWrap.className = s;
      orbStatus.className = s;
      const labels = { idle:'Click to speak', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking…' };
      orbStatus.textContent = labels[s] || '';
    }

    function showToast(msg, isError) {
      toast.textContent = msg;
      toast.className = 'show' + (isError ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.className = ''; }, 3000);
    }

    function md(text) {
      return text
        .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    function appendToken(tok) {
      state.buffer += tok;
      clearTimeout(state.streamTimeout);
      state.streamTimeout = setTimeout(() => {
        responseText.innerHTML = md(state.buffer);
        responseArea.scrollTop = responseArea.scrollHeight;
      }, 16);
    }

    function showToolBadge(name) {
      const el = document.createElement('div');
      el.className = 'tool-badge';
      el.id = 'tool-' + name;
      el.textContent = name.replace(/_/g, ' ');
      toolBadges.appendChild(el);
    }

    function removeToolBadge(name) {
      const el = document.getElementById('tool-' + name);
      if (el) el.remove();
    }

    // ── Conversation persistence ───────────────────────────────────────────────
    function saveConversation(firstMsg) {
      const convos = JSON.parse(localStorage.getItem('jarvis_convos') || '[]');
      const id = Date.now();
      convos.unshift({ id, preview: firstMsg.substring(0, 60), time: new Date().toLocaleString(), messages: [] });
      if (convos.length > 50) convos.length = 50;
      localStorage.setItem('jarvis_convos', JSON.stringify(convos));
      localStorage.setItem('jarvis_active', id);
      renderChatList();
      return id;
    }

    function updateConversation(id, messages) {
      const convos = JSON.parse(localStorage.getItem('jarvis_convos') || '[]');
      const c = convos.find(c => c.id == id);
      if (c) { c.messages = messages; localStorage.setItem('jarvis_convos', JSON.stringify(convos)); }
    }

    function renderChatList() {
      const convos = JSON.parse(localStorage.getItem('jarvis_convos') || '[]');
      const active = localStorage.getItem('jarvis_active');
      chatList.innerHTML = '';
      if (convos.length === 0) {
        chatList.innerHTML = '<div style="padding:16px;font-size:11px;color:var(--text3);text-align:center">No past conversations</div>';
        return;
      }
      convos.forEach(c => {
        const el = document.createElement('div');
        el.className = 'chat-item' + (c.id == active ? ' active' : '');
        el.innerHTML = `<div class="chat-preview">${c.preview}</div><div class="chat-time">${c.time}</div>`;
        el.addEventListener('click', () => viewConversation(c));
        chatList.appendChild(el);
      });
    }

    function viewConversation(c) {
      state.viewingOld = true;
      orbView.style.display = 'none';
      chatView.className = 'visible';
      chatView.innerHTML = '';

      if (!c.messages || c.messages.length === 0) {
        chatView.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px">No messages saved for this conversation.</div>';
      } else {
        c.messages.forEach(m => addMsgBubble(m.role, m.content));
      }

      // Update active
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    function addMsgBubble(role, content) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'jarvis' ? 'J' : 'U';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = md(content);
      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = new Date().toLocaleTimeString();
      wrap.appendChild(avatar);
      const inner = document.createElement('div');
      inner.appendChild(bubble);
      inner.appendChild(time);
      wrap.appendChild(inner);
      chatView.appendChild(wrap);
      chatView.scrollTop = chatView.scrollHeight;
    }

    function backToOrb() {
      state.viewingOld = false;
      chatView.className = '';
      orbView.style.display = '';
    }

    // ── Send message ───────────────────────────────────────────────────────────
    let activeConvoId = null;

    async function sendMessage(text) {
      if (!text || state.processing) return;
      state.processing = true;
      sendBtn.disabled = true;

      // First message in new convo → save
      if (state.history.length === 0) {
        activeConvoId = saveConversation(text);
      }

      // Show in orb view
      if (state.viewingOld) backToOrb();
      userText.textContent = text;
      userText.classList.add('visible');
      state.buffer = '';
      responseText.innerHTML = '';
      toolBadges.innerHTML = '';
      setOrb('thinking');

      state.history.push({ role: 'user', content: text });

      window.jarvis.removeListeners('chat:token');
      window.jarvis.removeListeners('chat:done');
      window.jarvis.removeListeners('chat:error');

      window.jarvis.onToken(data => {
        if (data.type === 'text') {
          appendToken(data.token);
        } else if (data.type === 'tool_start') {
          showToolBadge(data.toolName);
        } else if (data.type === 'tool_end') {
          removeToolBadge(data.toolName);
        }
      });

      window.jarvis.onDone(data => {
        clearTimeout(state.streamTimeout);
        responseText.innerHTML = md(state.buffer);
        toolBadges.innerHTML = '';

        const resp = data.fullResponse || state.buffer;
        state.history.push({ role: 'assistant', content: resp });

        // Save full messages to localStorage
        if (activeConvoId) updateConversation(activeConvoId, state.history.map(m => ({
          role: m.role === 'assistant' ? 'jarvis' : m.role,
          content: m.content
        })));

        if (state.ttsOn) {
          setOrb('speaking');
          // TTS is handled server-side; set idle after estimated time
          const words = resp.split(' ').length;
          const ms = Math.max(2000, words * 350);
          setTimeout(() => setOrb('idle'), ms);
        } else {
          setOrb('idle');
        }

        state.processing = false;
        sendBtn.disabled = false;
        userText.classList.remove('visible');
      });

      window.jarvis.onError(data => {
        toolBadges.innerHTML = '';
        showToast(data.error, true);
        setOrb('idle');
        state.processing = false;
        sendBtn.disabled = false;
      });

      window.jarvis.sendMessage(text, state.history.slice(0, -1));
    }

    // ── Voice ──────────────────────────────────────────────────────────────────
    async function startVoice() {
      if (state.processing) return;
      setOrb('listening');
      try {
        const r = await window.jarvis.listen();
        if (r.error) { showToast('Voice error: ' + r.error, true); setOrb('idle'); return; }
        const t = (r.transcript || '').trim();
        if (!t) { showToast('No speech detected'); setOrb('idle'); return; }
        textInput.value = '';
        await sendMessage(t);
      } catch (e) {
        showToast('Voice error: ' + e.message, true);
        setOrb('idle');
      }
    }

    orbWrap.addEventListener('click', startVoice);

    // ── Text input ─────────────────────────────────────────────────────────────
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const t = textInput.value.trim();
        if (t) { textInput.value = ''; sendMessage(t); }
      }
    });

    sendBtn.addEventListener('click', () => {
      const t = textInput.value.trim();
      if (t) { textInput.value = ''; sendMessage(t); }
    });

    // ── Controls ───────────────────────────────────────────────────────────────
    document.getElementById('clear-btn').addEventListener('click', () => {
      state.history = [];
      state.buffer = '';
      activeConvoId = null;
      responseText.innerHTML = '';
      userText.textContent = '';
      userText.classList.remove('visible');
      toolBadges.innerHTML = '';
      setOrb('idle');
      if (state.viewingOld) backToOrb();
    });

    document.getElementById('history-btn').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      state.sidebarOpen = !state.sidebarOpen;
    });

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      document.getElementById('clear-btn').click();
    });

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    ttsSwitch.addEventListener('click', () => {
      state.ttsOn = !state.ttsOn;
      ttsSwitch.className = 'toggle-switch' + (state.ttsOn ? ' on' : '');
      window.jarvis.saveSettings({ ttsEnabled: state.ttsOn });
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    async function init() {
      renderChatList();
      try {
        const s = await window.jarvis.getSettings();
        if (s) {
          state.ttsOn = s.ttsEnabled !== false;
          ttsSwitch.className = 'toggle-switch' + (state.ttsOn ? ' on' : '');
        }
      } catch {}
      setOrb('idle');
    }

    init();
  </script>
</body>
</html>
