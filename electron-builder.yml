appId: com.jarvis.ai
productName: JARVIS
directories:
  output: dist
files:
  - src/**
  - data/**
  - assets/**
  - node_modules/**
  - .env
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  category: public.app-category.productivity
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
